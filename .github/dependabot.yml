version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Angular pins TypeScript through the @angular/build peer range (22.2: >=6.0 <6.1),
      # so a newer TypeScript breaks `npm ci`. It moves together with Angular via `ng update`.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Node typings follow the Node major the site is built with (22, see ci.yml) — not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns:
          [
            '@angular/*',
            '@angular-devkit/*',
            '@schematics/*',
            'angular-eslint',
            '@angular-eslint/*',
          ]
      tooling:
        patterns:
          ['eslint*', 'typescript-eslint', 'prettier', 'vitest', 'jsdom', 'typescript', '@types/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
