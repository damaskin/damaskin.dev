@let c = content();
@let h = c.hero;

<canvas #canvas class="hero__canvas" aria-hidden="true"></canvas>
<div class="hero__shade" aria-hidden="true"></div>

<div class="hero__inner container">
  <p class="hero__eyebrow mono" data-hero="eyebrow">{{ h.eyebrow }}</p>

  <!-- Letters are rendered on the server and rise in with CSS: the name is on screen at first paint, no JS needed. -->
  <h1 class="hero__name display" [attr.aria-label]="h.firstName + ' ' + h.lastName">
    <span class="hero__line" data-line="first" aria-hidden="true">
      @for (ch of firstChars(); track $index) {
        <span class="hero__char" [style.--i]="$index">{{ ch }}</span>
      }</span
    >&ngsp;
    <span class="hero__line hero__line--last" data-line="last" aria-hidden="true">
      @for (ch of lastChars(); track $index) {
        <span class="hero__char" [style.--i]="$index + firstChars().length">{{ ch }}</span>
      }
      <span class="hero__caret"></span>
    </span>
  </h1>

  <div class="hero__bottom">
    <p class="hero__lead" data-hero="rise">{{ h.lead }}</p>

    <div class="hero__actions" data-hero="fade" style="--d: 0.7s">
      <a class="btn btn--primary" ddMagnetic [href]="'mailto:' + c.contact.email">
        {{ h.primaryCta }}
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
      </a>
      <a class="btn" ddMagnetic [href]="c.cvHref" download="Ivan_Damaskin_CV.pdf">
        {{ h.secondaryCta }}
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 2v9M4 7l4 4 4-4M3 14h10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
        </svg>
      </a>
    </div>

    <ul class="hero__meta mono" data-hero="fade" style="--d: 0.85s">
      <li class="hero__status"><span class="hero__dot" aria-hidden="true"></span>{{ h.status }}</li>
      <li>{{ h.location }}</li>
    </ul>
  </div>
</div>

<a class="hero__scroll mono" href="#about" data-hero="fade" style="--d: 1.1s" data-cursor>
  <span>{{ h.scroll }}</span>
  <span class="hero__scroll-line" aria-hidden="true"></span>
</a>
