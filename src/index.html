    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Motion is on unless the visitor asked for less. If the animation code never starts
      // (blocked script, old browser), the watchdog shows everything after 3.5 s.
      (function (d, w) {
        if (w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        d.documentElement.classList.add('motion');
        setTimeout(function () {
          if (!w.__ddMotion) d.documentElement.classList.remove('motion');
        }, 3500);
      })(document, window);
    </script>
  </head>

  </body>
