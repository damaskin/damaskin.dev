<!doctype html>
<!-- Open Graph card, 1200×630. Rendered to public/og/og-{ru,en}.png with any headless Chrome, e.g.:
     chrome --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=3000 \
       --screenshot=public/og/og-ru.png "file:///…/scripts/og/og.html?lang=ru"                    -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: O;
        src: url('../../public/fonts/onest-cyrillic-wght-normal.woff2');
        unicode-range: U+0400-045F;
        font-weight: 100 900;
      }
      @font-face {
        font-family: O;
        src: url('../../public/fonts/onest-latin-wght-normal.woff2');
        unicode-range: U+0000-00FF, U+2000-206F, U+2190-2193;
        font-weight: 100 900;
      }
      @font-face {
        font-family: M;
        src: url('../../public/fonts/jetbrains-mono-latin-wght-normal.woff2');
        unicode-range: U+0000-00FF, U+2000-206F;
        font-weight: 100 800;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f5f4ef;
        color: #16161a;
        font-family: O, sans-serif;
      }
      .wrap {
        position: absolute;
        inset: 60px 72px 56px;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .site {
        font:
          500 22px M,
          monospace;
        color: #4b4b53;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 8px 20px 8px 16px;
        border: 1.5px solid rgb(22 22 26 / 0.22);
        border-radius: 999px;
        font-size: 22px;
        font-weight: 500;
      }
      .status i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #15803d;
      }
      h1 {
        margin: 54px 0 0;
        font-size: 112px;
        font-weight: 650;
        line-height: 1;
        letter-spacing: -0.045em;
      }
      .role {
        margin: 18px 0 0;
        font-size: 40px;
        font-weight: 500;
        letter-spacing: -0.025em;
        color: #4b4b53;
      }
      .role b {
        color: #2a42d4;
        font-weight: 500;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        margin: auto 0 0;
        padding: 0;
        list-style: none;
        border-top: 1.5px solid rgb(22 22 26 / 0.12);
      }
      .metrics li {
        padding: 22px 20px 0;
        border-left: 1.5px solid rgb(22 22 26 / 0.12);
      }
      .metrics li:first-child {
        padding-left: 0;
        border-left: 0;
      }
      .metrics b {
        display: block;
        font-size: 50px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.035em;
      }
      .metrics span {
        display: block;
        margin-top: 10px;
        font-size: 20px;
        line-height: 1.3;
        color: #4b4b53;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <span class="site">damaskin.dev</span>
        <span class="status"><i></i><span id="status"></span></span>
      </div>
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
      <ul class="metrics" id="metrics"></ul>
    </div>
    <script>
      const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ru';
      const t = {
        ru: {
          name: 'Иван Дамаскин',
          role: 'Fullstack-разработчик <b>·</b> Angular / Node.js',
          status: 'Открыт к предложениям',
          metrics: [
            ['11+', 'лет в коммерческой веб-разработке'],
            ['8', 'продуктов во фронтенде INSAPP'],
            ['180+', 'партнёрских лендингов и виджетов'],
            ['11 → 22', 'Angular: миграция продуктовой линейки'],
          ],
        },
        en: {
          name: 'Ivan Damaskin',
          role: 'Fullstack developer <b>·</b> Angular / Node.js',
          status: 'Open to offers',
          metrics: [
            ['11+', 'years of commercial web development'],
            ['8', 'products in the INSAPP frontend'],
            ['180+', 'partner landings and widgets'],
            ['11 → 22', 'Angular: product line migration'],
          ],
        },
      }[lang];
      document.documentElement.lang = lang;
      document.getElementById('name').textContent = t.name;
      document.getElementById('role').innerHTML = t.role;
      document.getElementById('status').textContent = t.status;
      document.getElementById('metrics').innerHTML = t.metrics
        .map(([v, l]) => `<li><b>${v}</b><span>${l}</span></li>`)
        .join('');
    </script>
  </body>
</html>
