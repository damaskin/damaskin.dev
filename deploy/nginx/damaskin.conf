# damaskin.dev — the product nginx. Terminates TLS (certificate: /etc/letsencrypt/active, see scripts/certs.sh)
# and serves the current release. :80 and HTTP-01 challenges are handled by the shared edge-nginx.

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css application/javascript text/plain application/json application/xml image/svg+xml
  application/manifest+json;

server_tokens off;

server {
  listen 443 ssl;
  http2 on;
  server_name damaskin.dev www.damaskin.dev;

  ssl_certificate     /etc/letsencrypt/active/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/active/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:damaskin:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/conf.d/security-headers.inc;

  # One address: www -> apex
  if ($host = www.damaskin.dev) { return 301 https://damaskin.dev$request_uri; }

  root /srv/site/current;
  index index.html;
  error_page 404 /404.html;

  # Challenges that arrive over https (e.g. Cloudflare "Always Use HTTPS" redirects them here)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
  }

  # Pages: always revalidate, so a deploy is visible at once
  location = / {
    try_files /index.html =404;
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
  }
  location = /en {
    try_files /en/index.html =404;
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
  }
  location = /en/ { return 301 /en; }
  location = /index.html { return 301 /; }
  location = /en/index.html { return 301 /en; }
  location = /index.csr.html { return 404; }

  # Angular output: content-hashed bundles at the root and self-hosted fonts — cache forever
  location ~* ^/(?:main|chunk|polyfills|styles)-[\w-]+\.(?:js|css)$ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location /fonts/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location ~ ^/(?:img|og)/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=2592000" always;
  }
  location /cv/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location / {
    try_files $uri =404;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
