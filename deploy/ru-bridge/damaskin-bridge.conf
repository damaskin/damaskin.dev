# damaskin.dev bridge for visitors from Russia — ru-bridge (Moscow VPS, 132.243.16.97), the same scheme as
# fithorse.ru / lunaclean.ru there. Installed as /etc/nginx/sites-enabled/zz-damaskin-bridge.conf by setup.sh
# (npm run deploy:bridge): first only the :80 part; /etc/damaskin-bridge/auto.sh enables :443 once DNS points
# here, the bridge has its own certificate and Hetzner has the real one.
#
#   browser in Russia ──(inside the country)──► this nginx: TLS damaskin.dev
#     ──► 127.0.0.1:9443 / :9444 — the FitHorse bridge SSH tunnels (fithorse-tunnel@*)
#     ──► Hetzner 127.0.0.1:443 → edge-nginx (SNI damaskin.dev) → damaskin-nginx → static files
#
# Why tunnels and not a plain proxy_pass: ТСПУ freezes roughly every third NEW connection Russia ↔ Hetzner
# after ~16 KB, and the CV page alone is ~110 KB (measurements — /opt/fithorse-bridge/README.md). The tunnels
# are checked with 128 KB right after they come up, and inside them nginx opens no new cross-border connections.
# They forward the whole edge port; the site is chosen by SNI (proxy_ssl_name).
#
# The site is static, so the bridge keeps a copy: hashed bundles and fonts — as long as they are asked for,
# images and the CV — an hour, pages — a minute, refreshed in the background. If Germany does not answer, the
# last copy is served: the site opens even while both tunnels are down. A deploy reaches Russia within a minute.
#
# nginx 1.24 (Ubuntu 24.04): http2 goes into `listen`. No default_server — the shared VPS keeps its neighbour as
# the :443 default. Names (cache zone, log format, upstream, session cache) are prefixed: the http context is shared.

# The whole build is ~2 MB; 100 MB leaves room for old releases (stale pages still point at their bundles).
proxy_cache_path /var/cache/nginx/damaskin levels=1:2 keys_zone=damaskin:10m
                 max_size=100m inactive=30d use_temp_path=off;

# Own log directory, rotated by /etc/logrotate.d/damaskin-bridge (14 days); the shared nginx logs are not touched.
log_format damaskin_bridge escape=json
  '{"t":"$time_iso8601","host":"$host","m":"$request_method","p":"$request_uri","s":$status,'
  '"rt":$request_time,"out":$bytes_sent,"up":"$upstream_addr","us":"$upstream_status",'
  '"ut":"$upstream_response_time","cache":"$upstream_cache_status","ip":"$remote_addr",'
  '"ref":"$http_referer","ua":"$http_user_agent"}';

upstream damaskin_origin {
  # Two tunnels — while one is being restarted, the other works. A dead port refuses at once: nginx takes the other.
  server 127.0.0.1:9443 max_fails=1 fail_timeout=5s;
  server 127.0.0.1:9444 max_fails=1 fail_timeout=5s;
  # Both tunnels down — straight to Hetzner: some connections freeze at 16 KB, retries and the cache cover it.
  server 167.233.91.168:443 backup;
  keepalive 8;
  keepalive_timeout 300s;
}

server {
  listen 80;
  server_name damaskin.dev www.damaskin.dev;
  access_log /var/log/nginx/damaskin/access.log damaskin_bridge;

  # ACME HTTP-01: the bridge's own tokens are in its webroot; the rest — the Hetzner certificate
  # (deploy/scripts/certs.sh) — go there, to edge-nginx :80 and the shared webroot. Tokens are tiny, 16 KB is no issue.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri @origin_acme;
  }
  location @origin_acme {
    proxy_pass http://167.233.91.168;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
  location / { return 301 https://damaskin.dev$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name www.damaskin.dev;

  ssl_certificate     /etc/damaskin-bridge/tls/fullchain.pem;
  ssl_certificate_key /etc/damaskin-bridge/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:damaskin_bridge:10m;
  ssl_session_timeout 1d;

  access_log /var/log/nginx/damaskin/access.log damaskin_bridge;

  # One address, as on Hetzner — answered here, without a trip to Germany.
  return 301 https://damaskin.dev$request_uri;
}

server {
  listen 443 ssl http2;
  server_name damaskin.dev;

  # Symlinks to the bridge's own Let's Encrypt certificate (auto.sh); renewed by the shared certbot.timer,
  # the deploy hook reload-nginx.sh reloads nginx.
  ssl_certificate     /etc/damaskin-bridge/tls/fullchain.pem;
  ssl_certificate_key /etc/damaskin-bridge/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:damaskin_bridge:10m;
  ssl_session_timeout 1d;

  access_log /var/log/nginx/damaskin/access.log damaskin_bridge;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # The real client IP: Hetzner does not see it otherwise (edge is SNI passthrough).
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  # TLS to the origin through the tunnel, with the damaskin.dev certificate verified: the Russia → Germany leg
  # crosses ТСПУ, a substitution is not let through.
  proxy_ssl_server_name on;
  proxy_ssl_name damaskin.dev;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_ssl_session_reuse on;

  # A frozen connection sends nothing: 10 s of silence — retry on the other tunnel. Static files come in under a second.
  proxy_connect_timeout 3s;
  proxy_send_timeout 10s;
  proxy_read_timeout 10s;
  proxy_next_upstream error timeout;
  proxy_next_upstream_tries 3;
  proxy_next_upstream_timeout 30s;

  proxy_buffers 32 16k;
  proxy_busy_buffers_size 64k;

  # Cache for every location below except /health. Query strings do not change a static file — one copy per path.
  # Stale copies are served while refreshing and whenever the origin fails; the browser revalidates with the
  # bridge by ETag (the origin's Cache-Control and security headers pass through unchanged).
  proxy_cache damaskin;
  proxy_cache_key $uri;
  proxy_cache_lock on;
  proxy_cache_revalidate on;
  proxy_cache_background_update on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  add_header X-Bridge-Cache $upstream_cache_status always;

  # The bridge itself is alive (no trip to Germany) — for monitoring.
  location = /bridge-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The whole chain, never from the cache.
  location = /health {
    proxy_cache off;
    proxy_pass https://damaskin_origin;
  }

  # Content-hashed bundles and self-hosted fonts: the origin marks them immutable for a year and the cache
  # follows that — each file crosses the border once.
  location ~* ^/(?:(?:main|chunk|polyfills|styles)-[\w-]+\.(?:js|css)$|fonts/) {
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_pass https://damaskin_origin;
  }

  # Screenshots, OG cards, the PDF CV: names without a hash — an hour, then a conditional request (304).
  location ~ ^/(?:img|og|cv)/ {
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 1h;
    proxy_cache_valid 404 1m;
    proxy_pass https://damaskin_origin;
  }

  # Pages and the rest (/, /en, robots.txt, sitemap.xml, icons): the origin says no-cache for browsers;
  # the bridge keeps a copy for a minute.
  location / {
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 301 1m;
    proxy_cache_valid 404 1m;
    proxy_pass https://damaskin_origin;
  }
}
