<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>404 — damaskin.dev</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: O;
        src: url('/fonts/onest-cyrillic-wght-normal.woff2') format('woff2');
        unicode-range: U+0400-045F;
        font-weight: 100 900;
      }
      @font-face {
        font-family: O;
        src: url('/fonts/onest-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      :root {
        --bg: #f5f4ef;
        --fg: #16161a;
        --muted: #4b4b53;
        --accent: #2a42d4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111113;
          --fg: #ededea;
          --muted: #b0b0b7;
          --accent: #9aa7ff;
        }
      }
      html {
        background: var(--bg);
        color: var(--fg);
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-content: center;
        gap: 16px;
        padding: 24px;
        font:
          400 1.0625rem/1.6 O,
          system-ui,
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: clamp(5rem, 20vw, 10rem);
        font-weight: 650;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      a {
        color: var(--fg);
        font-weight: 500;
        text-underline-offset: 5px;
      }
      a:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>Такой страницы нет. <span lang="en">This page does not exist.</span></p>
    <p><a href="/">← На главную</a> · <a href="/en" lang="en">Home</a></p>
  </body>
</html>
